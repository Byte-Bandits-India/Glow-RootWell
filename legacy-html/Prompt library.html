<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Rootwell – Prompt library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#1F2433;--muted:#6B7085;--line:#ECEAF2;--soft:#F7F6FA;--green:#2F5D3A;--org:#E8574A;
  --grad:linear-gradient(135deg,#F4A340,#E8574A);
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--org);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:700;font-size:1.3rem;letter-spacing:-.03em;text-decoration:none;display:flex;gap:9px;align-items:center}
.logo svg{width:22px;height:22px;fill:var(--green)}
.nav{display:flex;gap:26px;align-items:center;font-size:.95rem}
.nav a:not(.go){text-decoration:none;color:var(--muted)}
.nav a:not(.go):hover{color:var(--ink)}
.go,.view{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.9rem;padding:9px 18px;border-radius:10px;background:var(--grad);color:#fff;transition:transform .2s,box-shadow .2s}
.go:hover,.view:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px var(--org)}
.title{padding:24px 0 24px}
.title h1{font-size:clamp(2.1rem,4.2vw,3.2rem);font-weight:600;letter-spacing:-.035em;line-height:1.05}
.title p{color:var(--muted);margin-top:8px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start;padding-bottom:80px}
aside{position:sticky;top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 10px}
aside h2{font-size:.82rem;font-weight:600;color:var(--muted);padding:12px 12px 6px}
.side{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:500}
.side:hover{background:var(--soft)}
.side[aria-pressed="true"]{background:linear-gradient(90deg,#FDEDE0,#FDEFF0);border-left-color:var(--org)}
.side .n{margin-left:auto;font-size:.82rem;color:var(--muted);font-weight:400}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,50,.04)}
.search{flex:1;min-width:200px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.sort{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.sort select{border:0;background:none;font:inherit;color:var(--ink);padding:12px 4px;cursor:pointer}
.seg{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;cursor:pointer;width:38px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#FDE6DC;color:var(--org)}
.count{color:var(--muted);font-size:.92rem;margin:0 0 14px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(20,24,50,.04);transition:box-shadow .2s}
.card:hover{box-shadow:0 14px 30px -18px rgba(20,24,50,.25)}
.tags{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;padding:5px 11px;border-radius:9px}
.pill.skin{background:#FCE7E1;color:#A24A33}.pill.gut{background:#E3F1D4;color:#4B6B25}.pill.nutrition{background:#FBF0C8;color:#85641A}.pill.fitness{background:#D6EFE8;color:#1F6B5C}
.pill.free{background:#DDF5E6;color:#1E7A46}.pill.starter{background:#E6EAFD;color:#3F4DB5}.pill.pro{background:#FDF1C7;color:#8A5A00}
.card h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin-top:4px}
.desc{color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.date{display:flex;align-items:center;gap:7px}
.grid.list{grid-template-columns:1fr}
.list .card{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t f""h f""d f";column-gap:28px;row-gap:8px;align-items:center}
.list .tags{grid-area:t;justify-content:flex-start}
.list h3{grid-area:h;margin:0}
.list .desc{grid-area:d;-webkit-line-clamp:2}
.list .foot{grid-area:f;margin:0;border:0;padding:0;flex-direction:column;align-items:flex-end;gap:12px}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:20px;padding:0;max-width:560px;width:calc(100% - 32px);background:#fff;color:var(--ink);box-shadow:0 40px 90px -30px rgba(20,24,50,.5)}
dialog::backdrop{background:rgba(20,24,50,.45)}
.dlg{padding:28px}
.dlg h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:14px 0 8px;line-height:1.2}
.dlg .desc{display:block;margin-bottom:14px}
.dlg .tags{justify-content:flex-start}
.pre{background:var(--soft);border-radius:12px;padding:16px;font-size:.95rem;white-space:pre-wrap}
.pre.lock p{filter:blur(5px);user-select:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:8px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;display:flex;gap:6px;overflow-x:auto;padding:10px}
  aside h2{display:none}
  .grp{display:contents}
  .side{width:auto;flex:none;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .side[aria-pressed="true"]{border-bottom-color:var(--org)}
  .side .n{margin-left:4px}
  .nav a:not(.go){display:none}
  .list .card{grid-template-columns:1fr;grid-template-areas:"t""h""d""f"}
  .list .foot{flex-direction:row;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="https://claude.ai/artifact/NWQy4yMYBDWztZsc2ymJku" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c0-6 1-10 8-16-1 7-3 11-8 16zM12 22C12 15 9 11 3 8c0 6 3 10 9 14z"/></svg>Rootwell</a>
    <div class="nav"><a href="https://claude.ai/artifact/NWQy4yMYBDWztZsc2ymJku" target="_blank" rel="noopener">Home</a><a href="https://claude.ai/artifact/NWQy4yMYBDWztZsc2ymJku#pricing" target="_blank" rel="noopener">Pricing</a><a class="go" href="https://claude.ai/artifact/NWQy4yMYBDWztZsc2ymJku#pricing" target="_blank" rel="noopener">Get instant access</a></div>
  </header>
  <div class="title"><h1>Prompt library</h1><p id="sum"></p></div>
  <div class="layout">
    <aside id="side" aria-label="Filters"></aside>
    <section aria-label="Prompts">
      <div class="bar">
        <input class="search" id="q" type="search" placeholder="Search prompts" aria-label="Search prompts">
        <label class="sort"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h7M4 18h4M18 5v14m0 0l-3-3m3 3l3-3"/></svg><select id="sort" aria-label="Sort prompts"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">A to Z</option></select></label>
        <div class="seg" role="group" aria-label="Layout">
          <button id="vg" aria-pressed="true" aria-label="Grid view"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
          <button id="vl" aria-pressed="false" aria-label="List view"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.500 6h.01M4.500 12h.01M4.500 18h.01"/></svg></button>
        </div>
      </div>
      <p class="count" id="cnt" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>
<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>
<script>
var CATS={skin:"Skin",gut:"Gut health",nutrition:"Nutrition",fitness:"Fitness"};
var BUN={free:"Free",starter:"Starter",pro:"Pro"};
var ROLE={skin:"skincare coach",gut:"gut health coach",nutrition:"nutrition coach",fitness:"fitness coach"};
var HOME="https://claude.ai/artifact/NWQy4yMYBDWztZsc2ymJku#pricing";
var IC={
 skin:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/>',
 gut:'<path d="M12 3c4 3 6 6 6 10a6 6 0 0 1-12 0c0-4 2-7 6-10z"/>',
 nutrition:'<path d="M12 8c-3-3-8-1-7 5 .8 4 3 7 5 7 1 0 1.200-.6 2-.6s1 .6 2 .6c2 0 4.200-3 5-7 1-6-4-8-7-5zM12 8c0-2 1-4 3-5"/>',
 fitness:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 free:'<path d="M5 12l4.500 4.500L19 7"/>',
 starter:'<path d="M12 4l2.400 5 5.600.7-4.100 3.800 1.100 5.500L12 16.300 7 19l1.100-5.500L4 9.700 9.600 9z"/>',
 pro:'<path d="M4 8l4 4 4-7 4 7 4-4-2 11H6z"/>'};
function ic(k){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'}
var CAL='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>';
var ARR='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5l5 5-5 5"/></svg>';
// Placeholder prompts: [title, category, bundle, updated, description]
var P=[
["Acne routine by skin type","skin","free","2026-10-24","Helps you build a simple morning and evening routine for acne-prone skin, matched to your skin type and budget."],
["Barrier repair 4-week routine","skin","starter","2026-10-22","Helps you calm irritated skin with a gentle 4-week plan that rebuilds your skin barrier step by step."],
["Sunscreen picker for humid climates","skin","starter","2026-10-18","Helps you choose a sunscreen that suits your skin and stays comfortable in hot, humid weather."],
["Gentle retinol starter plan","skin","pro","2026-10-15","Helps you introduce retinol slowly, with a schedule that limits dryness and irritation."],
["Ingredient layering checker","skin","pro","2026-10-09","Helps you check which skincare actives can be used together and in what order."],
["Dark spot fading plan","skin","pro","2026-09-30","Helps you plan a steady routine to fade dark spots and protect your results."],
["Bloating relief food diary","gut","free","2026-10-25","Helps you log meals and symptoms for a week and spot patterns behind your bloating."],
["Probiotic food planner","gut","starter","2026-10-20","Helps you add probiotic-rich foods to your week in a way that suits your diet."],
["Gut and skin check-in","gut","starter","2026-10-12","Helps you explore how digestion, food and skin flare-ups may be connected."],
["Doctor visit question list","gut","starter","2026-10-05","Helps you prepare clear questions and notes for your next gut health appointment."],
["Low-FODMAP week planner","gut","pro","2026-10-17","Helps you plan a week of low-FODMAP meals with swaps for common trigger foods."],
["Trigger food detective","gut","pro","2026-09-28","Helps you track and narrow down foods that may be causing discomfort."],
["Balanced thali builder","nutrition","free","2026-10-23","Helps you build balanced Indian meals with the right mix of protein, carbs and vegetables."],
["Grocery list from a meal plan","nutrition","free","2026-10-11","Helps you turn any meal plan into a tidy, budget-aware shopping list."],
["Weekly macro meal plan","nutrition","pro","2026-10-19","Helps you create a weekly meal plan around your calorie and macro targets."],
["Vegetarian protein planner","nutrition","pro","2026-10-08","Helps you reach your daily protein goal with vegetarian foods you already enjoy."],
["Packaged food label reader","nutrition","pro","2026-10-02","Helps you read ingredient lists and nutrition labels on packaged foods with confidence."],
["Nutrient gap review","nutrition","pro","2026-09-26","Helps you review your usual meals and spot nutrients you may be missing."],
["20-minute home workout","fitness","free","2026-10-21","Helps you get a short, equipment-free workout that fits your level and your day."],
["Desk-day mobility breaks","fitness","free","2026-10-07","Helps you add quick stretch and movement breaks to a long day at your desk."],
["PCOD-friendly weekly routine","fitness","pro","2026-10-16","Helps you build a gentle weekly exercise routine that works with PCOD, at your own pace."],
["Recovery day planner","fitness","pro","2026-10-10","Helps you plan rest days with light movement, stretching and sleep habits."],
["Beginner strength plan","fitness","pro","2026-10-03","Helps you start strength training with a simple plan and clear progressions."],
["Habit tracker setup","fitness","pro","2026-09-27","Helps you set up a simple tracker for the small daily habits you want to keep."]
];
var f={b:null,c:null},q="",sort="new";
var side=document.getElementById("side"),grid=document.getElementById("grid"),dlg=document.getElementById("dlg");
var TINT={skin:["#FCE7E1","#A24A33"],gut:["#E3F1D4","#4B6B25"],nutrition:["#FBF0C8","#85641A"],fitness:["#D6EFE8","#1F6B5C"]};
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"})}
function n(k,v){return P.filter(function(p){return p[k==="b"?2:1]===v}).length}
function pills(p){return '<div class="tags"><span class="pill '+p[1]+'">'+ic(p[1])+CATS[p[1]]+'</span><span class="pill '+p[2]+'">'+ic(p[2])+BUN[p[2]]+'</span></div>'}
function renderSide(){
  var h='<div class="grp"><button class="side" data-k="all" aria-pressed="'+(!f.b&&!f.c)+'">All prompts<span class="n">'+P.length+'</span></button>';
  for(var b in BUN)h+='<button class="side" data-k="b" data-v="'+b+'" aria-pressed="'+(f.b===b)+'">'+BUN[b]+'<span class="n">'+n("b",b)+'</span></button>';
  h+='</div><h2>Categories</h2><div class="grp">';
  for(var c in CATS)h+='<button class="side" data-k="c" data-v="'+c+'" aria-pressed="'+(f.c===c)+'"><span class="ico" style="background:'+TINT[c][0]+';color:'+TINT[c][1]+'">'+ic(c)+'</span>'+CATS[c]+'<span class="n">'+n("c",c)+'</span></button>';
  side.innerHTML=h+'</div>';
}
function renderGrid(){
  var L=P.filter(function(p){return(!f.b||p[2]===f.b)&&(!f.c||p[1]===f.c)&&p[0].toLowerCase().indexOf(q)>-1});
  L.sort(function(a,b){return sort==="az"?a[0].localeCompare(b[0]):sort==="old"?a[3].localeCompare(b[3]):b[3].localeCompare(a[3])});
  document.getElementById("cnt").textContent=L.length+(L.length===1?" prompt":" prompts");
  if(!L.length){grid.innerHTML='<p class="empty">No prompts match. Try another filter or search.</p>';return}
  grid.innerHTML=L.map(function(p){var i=P.indexOf(p);
    return '<article class="card">'+pills(p)+'<h3>'+p[0]+'</h3><p class="desc">'+p[4]+'</p><div class="foot"><span class="date">'+CAL+fmt(p[3])+'</span><button class="view" data-i="'+i+'">View '+ARR+'</button></div></article>'}).join("");
}
function open(i){
  var p=P[i],free=p[2]==="free";
  var txt="Act as a "+ROLE[p[1]]+". I want help with: "+p[0].toLowerCase()+".\n\nFirst ask me about [your age], [your goals] and [anything you avoid]. Then give me a clear, step-by-step plan I can start today.";
  document.getElementById("dbody").innerHTML=pills(p)+'<h2>'+p[0]+'</h2><p class="desc">'+p[4]+'</p><div class="pre'+(free?'':' lock')+'"><p>'+txt+'</p></div>'+
  '<div class="row">'+(free?'<button class="view" id="cp">Copy prompt</button>':'<a class="view" href="'+HOME+'" target="_blank" rel="noopener">Unlock with '+(p[2]==="starter"?"Starter or Pro":"Pro")+'</a>')+'<button class="x" id="cl">Close</button></div>';
  dlg.showModal();
  document.getElementById("cl").onclick=function(){dlg.close()};
  var cp=document.getElementById("cp");
  if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(txt).then(function(){cp.textContent="Copied"})}catch(e){cp.textContent="Select and copy"}};
}
function setView(list){grid.classList.toggle("list",list);document.getElementById("vl").setAttribute("aria-pressed",list);document.getElementById("vg").setAttribute("aria-pressed",!list)}
document.getElementById("vg").onclick=function(){setView(false)};
document.getElementById("vl").onclick=function(){setView(true)};
side.addEventListener("click",function(e){var b=e.target.closest(".side");if(!b)return;var k=b.dataset.k,v=b.dataset.v;
  if(k==="all"){f={b:null,c:null}}else{f[k]=f[k]===v?null:v}renderSide();renderGrid()});
grid.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)open(+b.dataset.i)});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
document.getElementById("q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();renderGrid()});
document.getElementById("sort").addEventListener("change",function(e){sort=e.target.value;renderGrid()});
document.getElementById("sum").textContent=P.length+" sample prompts. Filter by bundle or category, then open any prompt.";
renderSide();renderGrid();
</script>
</body>
</html>
